<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden 4-Hub Daily Irrigation Hub Controller</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        .panel { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { color: #ffffff; text-align: center; margin-top: 0; border-bottom: 2px solid #00ff66; padding-bottom: 10px; font-weight: 500; font-size: 22px; }
        
        /* Clickable Navigation Tabs Layout */
        .tab-bar { display: flex; justify-content: space-between; background: #262626; border-radius: 6px; padding: 4px; margin-bottom: 20px; border: 1px solid #3a3a3a; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 10px 12px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; flex-grow: 1; text-align: center; transition: background 0.2s, color 0.2s; }
        .tab-btn:hover { color: #fff; background: #333; }
        .tab-btn.active { background: #00ff66; color: #000; }
        
        /* Hub Content Visibility Constraints */
        .hub-content { display: none; } 
        .hub-content.active { display: block; }
        
        /* Custom Irrigation Grid Formatting Matrix */
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; background: #181818; }
        td { border: 1px solid #2d2d2d; padding: 8px; text-align: center; vertical-align: middle; }
        .channel-header { background: #262626; color: #00ff66; font-weight: bold; text-align: left; padding-left: 12px; font-size: 13px; text-transform: uppercase; }
        .mode-row { background: #1f2d1f; }
        
        /* Interactive Input Component Parameter Wrappers */
        input[type="time"] { background: #121212; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 3px; font-family: monospace; font-size: 14px; }
        input[type="time"]:focus { border-color: #00ff66; outline: none; }
        input[type="range"] { width: 85px; cursor: pointer; accent-color: #00ff66; }
        .mode-lbl { font-weight: bold; font-size: 12px; min-width: 65px; display: inline-block; }
        .lbl-off { color: #ff3333; } .lbl-auto { color: #ffb700; } .lbl-on { color: #00ff66; }
        
        /* Hardware Parameter Elements */
        button.submit-btn { background: #00ff66; color: #000; border: none; padding: 12px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: background 0.15s; }
        button.submit-btn:hover { background: #00cc52; }
        .batt { font-family: monospace; font-size: 14px; color: #aaa; padding: 12px; }
        meter { width: 180px; height: 16px; vertical-align: middle; margin-left: 10px; }
        hr { border: 0; border-top: 1px solid #333; margin: 15px 0; }
        
        /* Diagnostic Console Ticker Output wrapper */
        pre { background: #0a0a0a; color: #00ff66; padding: 12px; border-radius: 5px; font-size: 12px; font-family: monospace; overflow-x: auto; max-height: 90px; border: 1px solid #222; margin: 15px 0 0 0; white-space: pre-wrap; }
        .footer { display: flex; justify-content: space-between; font-size: 11px; color: #555; margin-top: 15px; font-family: monospace; }
    </style>
</head>
<body>
<body>
<div class="panel">
        <div style="text-align: center; margin-top: 1px; margin-bottom: 10px; font-family: monospace; font-size: 14px; color: #aaa;">
        🖥️ Current Time: <span id="liveClockDisplay" style="color: #00ff66; font-weight: bold;">00:00:00 AM</span>

        <h2>🌳 Garden Cloud Irrigation Hub Controller</h2>
    </div>

	
    <!-- --- INTEGRATED: LIVE SYSTEM MASTER BATTERY CONTAINER BLOCK --- -->
    <div id="masterBatteryCard" style="display:none; background: #1a1a1a; border: 1px solid #ff9900; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-family: monospace; font-size: 14px; box-shadow: 0 0 8px rgba(255,153,0,0.2); transition: all 0.3s ease;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <span id="masterAdcTitle" style="color: #ff9900; font-weight: bold;">🔋 Master Node: Connecting...</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <!-- Exact same max="1023" meter attribute footprint used by field hub rows -->
                <meter id="masterMeter" min="0" max="1023" value="0" style="width: 140px; height: 16px; transition: all 0.3s ease;"></meter>
                <span id="masterAdcText" style="color: #ff9900; font-weight: bold;">0000 ADC</span>
            </div>
        </div>
    </div>
        <!-- Your navigation tabs and tables workspace sit active here -->
        <!-- Your navigation tabs and tables workspace sit active here -->
        <div class="tab-bar" id="tabBarContainer" style="display: none;"></div>
        <div id="hubTablesWorkspace" style="display: none;"></div>

        <!-- --- FIX: ADDED WORD-BREAK TO PREVENT TEXT FROM CLIPPING --- -->
        <div id="terminalLog" style="background: #111; color: #ff9900; font-family: monospace; padding: 12px; border-radius: 4px; border: 1px solid #333; margin-top: 20px; font-size: 14px; text-align: center; font-weight: bold; box-shadow: inset 0 0 6px rgba(0,0,0,0.8); word-break: break-all; white-space: normal; line-height: 1.4;">
            Last command: Awaiting Hardware Sync...
        </div>
        <!-- ----------------------------------------------------------- -->
    </div>
</body>
